{% extends "base.html" %}

{% block title %}Edit Movie - MoodScape{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Edit Movie</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Movie Title:</label>
            <input type="text" id="name" name="name" value="{{ movie.Name }}" required>
        </div>
        
        <div class="form-group">
            <label for="summary">Summary:</label>
            <textarea id="summary" name="summary" rows="4">{{ movie.Summary }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="release_year">Release Year:</label>
            <input type="number" id="release_year" name="release_year" value="{{ movie.ReleaseYear }}" min="1900" max="2025" required>
        </div>
        
        <div class="form-group">
            <label for="genre_id">Genre:</label>
            <select id="genre_id" name="genre_id" required>
                <option value="">Select Genre</option>
                {% for genre in genres %}
                    <option value="{{ genre.GenreID }}" {% if genre.GenreID == movie.GenreID %}selected{% endif %}>
                        {{ genre.GenreName }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Update Movie</button>
        <a href="{{ url_for('movie_detail', movie_id=movie.MovieID) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
