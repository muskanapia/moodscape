{% extends "base.html" %}

{% block title %}Add Movie - MoodScape{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Add New Movie</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Movie Title:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="summary">Summary:</label>
            <textarea id="summary" name="summary" rows="4"></textarea>
        </div>
        
        <div class="form-group">
            <label for="release_year">Release Year:</label>
            <input type="number" id="release_year" name="release_year" min="1900" max="2025" required>
        </div>
        
        <div class="form-group">
            <label for="genre_id">Genre:</label>
            <select id="genre_id" name="genre_id" required>
                <option value="">Select Genre</option>
                {% for genre in genres %}
                    <option value="{{ genre.GenreID }}">{{ genre.GenreName }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Add Movie</button>
        <a href="{{ url_for('list_movies') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
